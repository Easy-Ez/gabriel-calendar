name: Package Node.js SDK and publish to npm

on:
  push:
    tags: ['node-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-npm-release

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Check release tag
        if: github.event_name == 'push'
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          version=$(node -p "require('./sdks/node/package.json').version")
          if [[ "$GITHUB_REF_NAME" != "node-v$version" ]]; then
            echo "::error::The release tag must match the Node.js SDK version"
            exit 1
          fi
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.22'
          enable-cache: false
      - run: npm ci --ignore-scripts
      - id: package-sdks
        run: bash scripts/package-sdks.sh
      - name: Rehearse npm publish
        env:
          PACKAGE_DIR: ${{ steps.package-sdks.outputs.package-dir }}
        run: |
          npm --version
          # Rehearsals can use a version already on npm.
          npm publish "$PACKAGE_DIR"/gabriel-calendar-*.tgz --dry-run --force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-distribution
          path: ${{ steps.package-sdks.outputs.package-dir }}/gabriel-calendar-*.tgz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/node-v') && github.repository == 'Easy-Ez/gabriel-calendar'
    needs: package
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-distribution
          path: dist
      - name: Publish verified tarball with Trusted Publishing
        run: npm publish ./dist/gabriel-calendar-*.tgz
